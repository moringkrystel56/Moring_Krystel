<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ms. K Graphic Solution</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="css/global.css">

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="css/frame5.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="main-header">

        <div class="logo">
            <img src="Assets/msk.png" alt="MSK Logo">
        </div>

        <nav>
            <a href="frame1.html">HOME</a>
            <a href="frame2.html">ABOUT</a>
            <a href="frame3.html">PROJECTS</a>
            <a href="frame4.html">SKILLS</a>
            <a href="frame5.html" class="active">CONTACT</a>
        </nav>

    </header>

    <!-- CONTACT SECTION -->
    <section class="contact-wrapper">

        <div class="contact-container">

            <!-- LEFT SIDE -->
            <div class="social-section">

                <h2>SOCIAL MEDIA<br>ACCOUNTS</h2>

                <div class="social-links">

                    <a href="#">
                        <i class="fab fa-facebook"></i>
                        <span>MsK Graphic Solution</span>
                    </a>

                    <a href="#">
                        <i class="fab fa-twitter"></i>
                        <span>@MsKGraphicSolution</span>
                    </a>

                    <a href="#">
                        <i class="fab fa-tiktok"></i>
                        <span>@MsKGraphicSolution</span>
                    </a>

                    <a href="#">
                        <i class="fab fa-instagram"></i>
                        <span>@MsKGraphicSolution</span>
                    </a>

                    <a href="#">
                        <i class="fab fa-linkedin"></i>
                        <span>MsK Graphic Solution</span>
                    </a>

                </div>

            </div>

            <!-- DIVIDER -->
            <div class="vertical-line"></div>

            <!-- RIGHT SIDE -->
            <div class="form-section">

                <form>

                    <div class="input-group">
                        <label>Name:</label>
                        <input type="text">
                    </div>

                    <div class="input-group">
                        <label>Email:</label>
                        <input type="email">
                    </div>

                    <div class="input-group textarea-group">
                        <label>Message:</label>
                        <textarea></textarea>
                    </div>

                    <button type="submit">SUBMIT</button>

                </form>

            </div>

        </div>

    </section>

</body>
</html>
